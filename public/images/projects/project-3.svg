<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Elahiyeh 4-Meter Bronze & Walnut Pivot Door">
  <defs>
    <linearGradient id="pg-3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B2A1E"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <radialGradient id="pr-3" cx="0.65" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#C8A165" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3B2A1E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#pg-3)"/>
  <rect width="800" height="600" fill="url(#pr-3)"/>
  <!-- Architectural Frame -->
  <rect x="32" y="32" width="736" height="536" rx="12" stroke="#C8A165" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- Wood Grain Topographic Lines -->
  <g stroke="#C8A165" stroke-opacity="0.22" stroke-width="1.2">
    <path d="M32 154 Q260 110 480 168 T768 141"/>
    <path d="M32 258 Q290 214 510 275 T768 245"/>
    <path d="M32 385 Q270 341 520 402 T768 368"/>
    <path d="M32 479 Q310 445 540 494 T768 472"/>
  </g>
  <!-- Central Architectural Composition -->
  <g transform="translate(400, 290)">
    <circle cx="0" cy="0" r="224" stroke="#C8A165" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="10 6"/>
    <circle cx="0" cy="0" r="176" fill="#3B2A1E" fill-opacity="0.7" stroke="#C8A165" stroke-width="2"/>
    <rect x="-161" y="-65" width="322" height="130" rx="8" transform="rotate(87)" fill="#1A1A1A" fill-opacity="0.65" stroke="#F5F1EA" stroke-width="2"/>
    <!-- Slatted Timber Joinery Detail -->
    <g stroke="#C8A165" stroke-width="2.2" stroke-opacity="0.8">
      <line x1="-90" y1="-45" x2="90" y2="-45"/>
      <line x1="-110" y1="-15" x2="110" y2="-15"/>
      <line x1="-110" y1="15" x2="110" y2="15"/>
      <line x1="-90" y1="45" x2="90" y2="45"/>
    </g>
    <circle cx="0" cy="0" r="26" fill="#C8A165"/>
    <circle cx="0" cy="0" r="10" fill="#F5F1EA"/>
  </g>
  <!-- Edition Number Plate -->
  <rect x="64" y="488" width="96" height="40" rx="6" fill="#3B2A1E" stroke="#C8A165" stroke-width="1.2"/>
  <text x="112" y="514" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="700" fill="#F5F1EA">KW—03</text>
</svg>
