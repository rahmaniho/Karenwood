    <path d="M32 178 Q260 140 480 186 T768 162"/>
    <path d="M32 276 Q290 238 510 290 T768 260"/>
    <path d="M32 400 Q270 362 520 414 T768 386"/>
    <path d="M32 488 Q310 460 540 503 T768 484"/>
  </g>
  <!-- Central Architectural Composition -->
  <g transform="translate(400, 290)">
    <circle cx="0" cy="0" r="202" stroke="#C8A165" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="10 6"/>
    <circle cx="0" cy="0" r="154" fill="#3B2A1E" fill-opacity="0.7" stroke="#C8A165" stroke-width="2"/>
    <rect x="-139" y="-65" width="278" height="130" rx="8" transform="rotate(174)" fill="#1A1A1A" fill-opacity="0.65" stroke="#7A8B6F" stroke-width="2"/>
    <!-- Slatted Timber Joinery Detail -->
