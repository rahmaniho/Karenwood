<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Fereshteh Smoked Oak Chevron Gallery Floor">
  <defs>
    <linearGradient id="pg-6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <radialGradient id="pr-6" cx="0.65" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#C8A165" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#pg-6)"/>
  <rect width="800" height="600" fill="url(#pr-6)"/>
  <!-- Architectural Frame -->
  <rect x="32" y="32" width="736" height="536" rx="12" stroke="#C8A165" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- Wood Grain Topographic Lines -->
