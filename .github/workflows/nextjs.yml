name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # NOTE: NODE_ENV is NOT set at the job level on purpose. With NODE_ENV=production,
    # `npm ci` skips devDependencies, and tailwindcss / postcss / autoprefixer are
    # declared as devDependencies in package.json. Without them, the production build
    # fails with "Cannot find module 'tailwindcss'". We set NODE_ENV=production only
    # for the build step itself.
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        # Skip configure-pages because next.config.js already handles
        # basePath/assetPrefix via GITHUB_REPOSITORY, and the auto-injector
        # is incompatible with the modern next.config.js syntax we use.
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-

      - name: Install dependencies (devDeps included for tailwindcss / postcss)
        run: npm ci

      - name: Build with Next.js (static export)
        env:
          NODE_ENV: production
        run: npm run build
        # No `continue-on-error` and no pipe-masking: if the build fails, this
        # step fails and the workflow stops here. The next step only runs on
        # success and would have failed anyway with a confusing "no out/ dir"
        # error.

      - name: Ensure .nojekyll exists in export
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
