name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        # Skip configure.pages because next.config.js already handles
        # basePath/assetPrefix via GITHUB_REPOSITORY, and the auto-injector
        # is incompatible with the modern next.config.js syntax we use.
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js (static export)
        # Use -euxo pipefail so any failing command aborts the whole step,
        # and capture the log to a file via redirection (NOT a pipe, so the
        # step's own exit code reflects next's real exit status).
        run: |
          set -euxo pipefail
          npm run build > build.log 2>&1 || true
          echo "--- out/ directory contents (if any) ---" >> build.log
          ls -la out 2>&1 >> build.log || true
          echo "--- END ---" >> build.log
        # Don't fail the step here; let the debug step below emit a clean error so
        # the log is uploaded to artifacts.

      - name: Verify out/ was produced
        run: |
          if [ ! -d out ]; then
            echo "::error::Static export directory 'out/' was NOT created by 'npm run build'. See build.log artifact for the full Next.js output."
            cat build.log
            exit 1
          fi

      - name: Ensure .nojekyll exists in export
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload.pages-artifact@v3
        with:
          path: ./out

      - name: Upload build log for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files_found: ignore

  # Deployment job
  deploy:
    environment:
      name: Github.pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy.pages@v4
